name: usage-coach-quality

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python tests/test_live_commands.py
      - run: python tests/test_window_consolidation.py
      - run: python -m unittest tests/test_guard_safety.py
      - run: python -m compileall -q coach.py tests
